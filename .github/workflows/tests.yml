
name: Controleursplanning — tests incl. OR-Tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Controleer OR-Tools
        run: python -c 'import ortools; print("OR-Tools aanwezig:", ortools.__version__)'
      - name: Alle tests, ook solver-integratie
        run: pytest -q -ra
